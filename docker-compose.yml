services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_lab3
    ports:
      - "127.0.0.1:4566:4566"           
      - "127.0.0.1:4510-4559:4510-4559" 
    environment:
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"